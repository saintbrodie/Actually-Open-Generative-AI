name: Patch desktop auth state

on:
  push:
    branches:
      - review/upstream-sync-2026-09-06

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch desktop auth state
        run: python .github/scripts/patch_desktop_auth_state.py

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Desktop auth state already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/AuthModal.js \
            src/components/SettingsModal.js \
            packages/studio/src/privacyApi.js \
            packages/studio/src/privacyVideoApi.js \
            src/lib/muapi.js \
            src/components/ImageStudio.js \
            src/components/VideoStudio.js
          git commit -m "refactor: separate desktop provider and compatibility auth"
          git push origin HEAD:review/upstream-sync-2026-09-06
