name: Dependency audit review

on:
  push:
    branches:
      - review/upstream-sync-2026-09-06

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-prod.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit-prod.json', 'utf8'));
          const rows = Object.entries(audit.vulnerabilities || {}).map(([name, v]) => ({
            name,
            severity: v.severity,
            direct: Boolean(v.isDirect),
            range: v.range,
            effects: v.effects || [],
            fixAvailable: v.fixAvailable,
            via: (v.via || []).map(x => typeof x === 'string' ? x : ({
              source: x.source,
              name: x.name,
              severity: x.severity,
              title: x.title,
              url: x.url,
              range: x.range,
            })),
          }));
          console.log('PRODUCTION_AUDIT_SUMMARY');
          console.log(JSON.stringify({ metadata: audit.metadata, vulnerabilities: rows }, null, 2));
          NODE
      - name: Audit all dependencies
        shell: bash
        run: |
          npm audit --json > audit-all.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit-all.json', 'utf8'));
          const rows = Object.entries(audit.vulnerabilities || {}).map(([name, v]) => ({
            name,
            severity: v.severity,
            direct: Boolean(v.isDirect),
            range: v.range,
            effects: v.effects || [],
            fixAvailable: v.fixAvailable,
            via: (v.via || []).map(x => typeof x === 'string' ? x : ({
              source: x.source,
              name: x.name,
              severity: x.severity,
              title: x.title,
              url: x.url,
              range: x.range,
            })),
          }));
          console.log('ALL_DEPENDENCIES_AUDIT_SUMMARY');
          console.log(JSON.stringify({ metadata: audit.metadata, vulnerabilities: rows }, null, 2));
          NODE
