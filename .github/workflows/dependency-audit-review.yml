name: Persist validated dependency upgrades

on:
  push:
    branches:
      - review/upstream-sync-2026-09-06

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: review/upstream-sync-2026-09-06

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Generate validated dependency graph
        shell: bash
        run: |
          npm pkg set engines.node=">=22.13.0"
          npm install axios@1.20.0 next@15.5.25 sharp@0.35.4
          npm install --save-dev electron@44.2.0 electron-builder@26.15.3 postcss@8.5.28 vite@8.2.2
          npm install axios@1.20.0 --workspace=studio
          npm install --save-dev postcss@8.5.28 --workspace=studio
          npm audit fix || true

          mapfile -t changed < <(git diff --name-only | sort)
          printf 'Generated dependency changes:\n%s\n' "${changed[*]}"
          expected=(package-lock.json package.json packages/studio/package.json)
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            echo "Unexpected files changed; refusing to persist."
            git status --short
            exit 1
          fi

      - name: Run Node tests
        run: node --test tests/*.test.js

      - name: Build workspace packages
        run: npm run build:packages

      - name: Build Next.js app
        run: npm run build

      - name: Build Vite renderer
        run: npm run vite:build

      - name: Package Electron Linux directory
        shell: bash
        run: npx electron-builder --linux dir --x64

      - name: Enforce audit ceiling
        shell: bash
        run: |
          npm audit --json > audit-all.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit-all.json', 'utf8'));
          const v = audit.metadata?.vulnerabilities || {};
          console.log('AUDIT', JSON.stringify(v));
          if ((v.critical || 0) > 0) throw new Error('Critical vulnerabilities remain');
          if ((v.total || 0) > 5) throw new Error(`Audit regressed to ${v.total} findings`);
          NODE

      - name: Commit validated dependency files
        shell: bash
        run: |
          git add package.json package-lock.json packages/studio/package.json
          if git diff --cached --quiet; then
            echo "Dependency files already match the validated graph."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: apply validated dependency security upgrades"
          git push origin HEAD:review/upstream-sync-2026-09-06
