name: Patch completed roadmap items

on:
  push:
    branches:
      - review/upstream-sync-2026-09-06

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README completed items
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          s = p.read_text()

          def replace(old, new, label):
              global s
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'{label}: source text not found')
              s = s.replace(old, new, 1)

          replace(
              '- **Live provider model discovery** for Venice and OpenRouter image/video catalogs. Fresh capabilities update mounted Image/Video pickers without a page reload and are cached locally for faster subsequent starts.\n',
              '- **Live provider model discovery** for Venice and OpenRouter image/video catalogs. Fresh capabilities update mounted Image/Video pickers without a page reload, stale discovered-only entries are pruned when credentials/catalogs change, and metadata is cached locally for faster subsequent starts.\n',
              'discovery summary',
          )
          replace(
              '- **Compatibility-only studios are gated explicitly** in BYOK-only sessions instead of mounting as though a MuAPI session exists and failing after an upload/generation attempt.\n',
              '- **Provider auth and compatibility auth are separate states.** BYOK-only sessions no longer mint a fake MuAPI key; legacy sentinel values are migration-only and are removed when encountered. Compatibility-only studios are gated explicitly before network work.\n',
              'auth summary',
          )
          replace(
              'Saving provider keys triggers discovery immediately. A normal page reload is no longer required just to expose newly discovered models.\n',
              'Saving provider keys triggers discovery immediately. A normal page reload is no longer required just to expose newly discovered models. Each refresh reconstructs the direct-provider slice from current credentials and discovery results, so removed-provider or disappeared discovered-only entries do not linger in the picker arrays.\n',
              'discovery lifecycle',
          )
          replace(
              'The compatibility key is optional. When it is absent, compatibility-only studios are gated before their network logic runs. When both compatibility and BYOK keys exist, routing follows the **selected model**, not simply the broadest credential available in the session.\n',
              'The compatibility key is optional. When it is absent, compatibility-only studios are gated before their network logic runs. Hosted and Vite/Electron shells track direct-provider credentials separately from compatibility auth; no fake compatibility credential is created for BYOK-only sessions. Older `__actually_open_byok__` values are removed as a migration step. When both compatibility and BYOK keys exist, routing follows the **selected model**, not simply the broadest credential available in the session.\n',
              'compatibility rationale',
          )
          replace(
              '- Compatibility-key sentinel rejection.\n- Mixed-session model-aware reference-upload routing rules and source-level studio wiring checks.\n',
              '- Legacy compatibility-sentinel rejection/migration, with provider and compatibility auth kept separate in hosted and desktop shells.\n- Provider-specific desktop generation auth, mixed-session model-aware reference-upload routing, and direct-provider pending-video resume without a MuAPI key.\n',
              'validation bullets',
          )
          replace(
              '1. Improve provider-catalog lifecycle handling: prune stale discovered-only entries when credentials are removed or provider catalogs shrink, expose refresh/loading/error state in the UI, and optionally provide a manual refresh control.\n',
              '1. Expose provider-catalog refresh/loading/error state in the UI and optionally provide a manual refresh control; stale discovered-only pruning is already handled by the runtime rebuild.\n',
              'roadmap catalog item',
          )
          replace(
              '4. Replace the remaining compatibility-key sentinel plumbing with first-class capability/auth state throughout the shell; the compatibility-only studio gate is the first step, not the final architecture.\n',
              '4. Continue consolidating per-studio provider/compatibility capability checks behind a shared auth/capability context instead of localStorage reads spread across shell and standalone studios; active fake-key sentinel plumbing has been removed.\n',
              'roadmap auth item',
          )

          p.write_text(s)
          PY

      - name: Commit README update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "README already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: mark catalog and auth lifecycle work complete"
          git push origin HEAD:review/upstream-sync-2026-09-06
