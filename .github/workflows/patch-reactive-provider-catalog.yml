name: Patch reactive provider catalog

on:
  push:
    branches:
      - review/upstream-sync-2026-09-06

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch catalogs and React subscribers
        shell: bash
        run: echo '' | base64 -d | python

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Reactive provider catalog already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/studio/src/modelFamilies.js packages/studio/src/components/ImageStudio.jsx packages/studio/src/components/VideoStudio.jsx packages/studio/src/index.js components/ApiKeyModal.js
          git commit -m "feat: refresh provider model pickers without reload"
          git push origin HEAD:review/upstream-sync-2026-09-06
