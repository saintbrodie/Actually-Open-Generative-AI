name: One-shot docs sync

on:
  push:
    branches:
      - review/upstream-sync-2026-09-06

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/upstream-sync-2026-09-06

      - name: Update README toolchain and validation notes
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()

          old_quick = """## Quick start\n\n### Hosted / Next.js\n"""
          new_quick = """## Quick start\n\nRequires **Node.js 22.13.0 or newer**. The repository includes `.nvmrc`, so nvm users can run `nvm use` before installing dependencies.\n\n### Hosted / Next.js\n"""
          if old_quick not in text:
              raise SystemExit("Quick start anchor not found")
          text = text.replace(old_quick, new_quick, 1)

          old_validation = """npm ci\nnode --test tests/*.test.js\nnpm run build:packages\nnpm run build\nnpm run vite:build\n"""
          new_validation = """npm ci\nnode --test tests/*.test.js\nnpm run build:packages\nnpm run build\nnpm run vite:build\nnpx electron-builder --linux dir --x64\nnpm audit --audit-level=critical\n"""
          if old_validation not in text:
              raise SystemExit("Validation command block not found")
          text = text.replace(old_validation, new_validation, 1)

          old_ci = """CI also parses/builds the Vite proxy configuration and catches workspace, Next.js, and Vite integration regressions. Manual live-key smoke testing is still necessary because mocked contracts cannot validate provider billing, account permissions, transient availability, or undocumented production changes.\n"""
          new_ci = """CI also parses/builds the Vite proxy configuration, packages an Electron Linux x64 directory as a desktop smoke test, and rejects any critical dependency advisory. The September 2026 dependency refresh reduced `npm audit` from 35 findings (including 1 critical) to 5 findings (4 moderate, 1 high, 0 critical). The remaining findings require breaking upgrades in Next.js or the upstream Design Agent dependency chain, so they are tracked rather than force-upgraded here. Manual live-key smoke testing is still necessary because mocked contracts cannot validate provider billing, account permissions, transient availability, or undocumented production changes.\n"""
          if old_ci not in text:
              raise SystemExit("CI description anchor not found")
          text = text.replace(old_ci, new_ci, 1)

          path.write_text(text)

      - name: Commit README
        shell: bash
        run: |
          git diff --exit-code -- . ':!README.md'
          git add README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: document Node 22 and security validation"
          git push origin HEAD:review/upstream-sync-2026-09-06
