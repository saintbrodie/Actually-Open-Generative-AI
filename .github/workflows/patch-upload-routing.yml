name: Patch mixed-session upload routing

on:
  push:
    branches:
      - review/upstream-sync-2026-09-06

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch studio upload call sites
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          image_path = Path('packages/studio/src/components/ImageStudio.jsx')
          image = image_path.read_text()
          if 'targetModelId={referenceVariant.model.id}' not in image:
              image = replace_once(
                  image,
                  'function UploadButton({ apiKey, maxImages, onSelect, onClear, initialUrls = [], label = null, persistedHistory = null, onHistoryChange = null, copy }) {',
                  'function UploadButton({ apiKey, targetModelId = null, maxImages, onSelect, onClear, initialUrls = [], label = null, persistedHistory = null, onHistoryChange = null, copy }) {',
                  'ImageStudio UploadButton signature',
              )
              image = replace_once(
                  image,
                  '''            const uploadedUrl = await uploadFile(apiKey, file, (pct) => {\n              setLastUploadProgress(pct);\n              setUploadHistory((prev) =>\n                prev.map((h) => (h.id === id ? { ...h, progress: pct } : h)),\n              );\n            });''',
                  '''            const uploadedUrl = await uploadFile(apiKey, file, (pct) => {\n              setLastUploadProgress(pct);\n              setUploadHistory((prev) =>\n                prev.map((h) => (h.id === id ? { ...h, progress: pct } : h)),\n              );\n            }, targetModelId);''',
                  'ImageStudio UploadButton upload',
              )
              image = replace_once(
                  image,
                  'return await uploadFile(apiKey, file);',
                  'return await uploadFile(apiKey, file, undefined, editor.model.id);',
                  'ImageStudio dropped upload',
              )
              image = replace_once(
                  image,
                  '''                <UploadButton\n                  apiKey={apiKey}\n                  maxImages={referenceImageLimit}''',
                  '''                <UploadButton\n                  apiKey={apiKey}\n                  targetModelId={referenceVariant.model.id}\n                  maxImages={referenceImageLimit}''',
                  'ImageStudio reference upload target',
              )
              image = replace_once(
                  image,
                  '''                <UploadButton\n                  apiKey={apiKey}\n                  maxImages={1}\n                  onSelect={({ urls }) => setSwapImageUrl(urls[0] || null)}''',
                  '''                <UploadButton\n                  apiKey={apiKey}\n                  targetModelId={selectedModelId}\n                  maxImages={1}\n                  onSelect={({ urls }) => setSwapImageUrl(urls[0] || null)}''',
                  'ImageStudio swap upload target',
              )
              image_path.write_text(image)

          video_path = Path('packages/studio/src/components/VideoStudio.jsx')
          video = video_path.read_text()
          if 'targetModelId = null' not in video:
              video = replace_once(
                  video,
                  'async (files, { label, maxBytes, setUploading, setProgress }) => {',
                  'async (files, { label, maxBytes, setUploading, setProgress, targetModelId = null }) => {',
                  'VideoStudio uploadFiles signature',
              )
              video = replace_once(
                  video,
                  '''            uploadFile(apiKey, file, (value) => {\n              progress[index] = value;\n              setProgress(\n                Math.round(progress.reduce((sum, item) => sum + item, 0) / progress.length),\n              );\n            }),''',
                  '''            uploadFile(apiKey, file, (value) => {\n              progress[index] = value;\n              setProgress(\n                Math.round(progress.reduce((sum, item) => sum + item, 0) / progress.length),\n              );\n            }, targetModelId),''',
                  'VideoStudio uploadFiles target forwarding',
              )
              video = replace_once(
                  video,
                  '''          : { label: slot.label, maxBytes: 50 * 1024 * 1024, setUploading: setAudioUploading, setProgress: setAudioProgress };\n\n      const uploadKey''',
                  '''          : { label: slot.label, maxBytes: 50 * 1024 * 1024, setUploading: setAudioUploading, setProgress: setAudioProgress };\n      options.targetModelId = targetModel?.id || null;\n\n      const uploadKey''',
                  'VideoStudio workflow target',
              )
              video = replace_once(
                  video,
                  '''          : { label: copy.media.audio, maxBytes: 50 * 1024 * 1024, setUploading: setAudioUploading, setProgress: setAudioProgress };\n      const urls = await uploadFiles''',
                  '''          : { label: copy.media.audio, maxBytes: 50 * 1024 * 1024, setUploading: setAudioUploading, setProgress: setAudioProgress };\n      options.targetModelId = target.variant.model.id;\n      const urls = await uploadFiles''',
                  'VideoStudio reference target',
              )
              video = replace_once(
                  video,
                  '''      const url = await uploadFile(apiKey, file, (pct) => {\n        setEndImageProgress(pct);\n      });''',
                  '''      const url = await uploadFile(apiKey, file, (pct) => {\n        setEndImageProgress(pct);\n      }, selectionAtStart.selectedModel);''',
                  'VideoStudio end-frame target',
              )
              video_path.write_text(video)
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Upload routing already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/studio/src/components/ImageStudio.jsx packages/studio/src/components/VideoStudio.jsx
          git commit -m "fix: route studio uploads by selected provider model"
          git push origin HEAD:review/upstream-sync-2026-09-06
